schema_version: 1

context:
  version: "0.3.0"

package:
  name: dau-sim
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dau-sim/dau_sim-${{ version }}.tar.gz
  sha256: fee7329025671d88b23319b51c34fb6092cacc85256fe602c4becf79bc4c72d9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dau-sim = dau_sim.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-js
    - hatchling
    - pip
    - pnpm
  run:
    - python >=${{ python_min }}
    - amaranth
    - csp
    - pyslang
    - rich
    - typer

tests:
  - python:
      imports:
        - dau_sim
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - dau-sim --help

about:
  summary: dau simulator
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/dau-dev/dau-sim
  repository: https://github.com/dau-dev/dau-sim

extra:
  recipe-maintainers:
    - timkpaine
